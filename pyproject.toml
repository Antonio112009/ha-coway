[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "BLE",    # flake8-blind-except
    "S",      # flake8-bandit
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and mock credentials are fine in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# pytest-timeout ships with the HA test harness; fail a hung test instead of
# blocking CI until the job limit.
timeout = 60

[tool.mypy]
python_version = "3.14"
files = ["custom_components/ha_coway"]
strict = true
warn_unreachable = true
